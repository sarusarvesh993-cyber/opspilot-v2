name: OpsPilot Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-cache: 'npm'
        node-version: 22

    - name: Install Project Dependencies
      run: npm ci

    - name: Lint & Static Type Verification
      run: npm run lint --if-present

    - name: Production Ready Build
      run: npm run build
      env:
        OPENAI_API_KEY: "mock-key-for-ci"